# Pure-Rust reference apps built directly against gpui-kit.
# Pixel and behavior gates compare Go apps against these binaries.
[package]
name = "gk-ref"
version.workspace = true
edition.workspace = true
publish.workspace = true

autobins = false

[dependencies]
gpui-kit.workspace = true
gk-meter.workspace = true

# Pinned to match the dependency versions exposed by gpui-kit.
anyhow = "1"
lsp-types = "=0.97.0"
ropey = "=2.0.0-beta.1"
jiff = { version = "=1.0.2", default-features = false }
image = { version = "=0.25.10", default-features = false }
accesskit = { version = "=0.24.1", default-features = false }

futures = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["gpui-fast"]
gpui-fast = ["gpui-kit/gpui-fast", "gk-meter/gpui-fast"]
diag = ["gpui-fast", "gpui-kit/test-support", "gk-meter/diag"]

[[bin]]
name = "ref-panels"
path = "src/bin/panels.rs"

[[bin]]
name = "ref-counter"
path = "src/bin/counter.rs"

[[bin]]
name = "ref-gallery"
path = "src/bin/gallery/main.rs"

[[bin]]
name = "ref-writerule"
path = "src/bin/writerule.rs"

[[bin]]
name = "ref-table"
path = "src/bin/table.rs"

[[bin]]
name = "ref-notes"
path = "src/bin/notes.rs"

[[bin]]
name = "ref-files"
path = "src/bin/files.rs"

[[bin]]
name = "ref-paint"
path = "src/bin/paint.rs"

[[bin]]
name = "ref-todo"
path = "src/bin/todo.rs"

[[bin]]
name = "ref-reader"
path = "src/bin/reader.rs"

[[bin]]
name = "ref-expenses"
path = "src/bin/expenses.rs"

[[bin]]
name = "ref-tutorial"
path = "src/bin/tutorial.rs"
