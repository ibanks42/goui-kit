# Upstream trait methods implemented by hand-written Rust runtime shims in core/src/.
# When gk_model.py audits delegate traits, matching entries are marked "bridged" with
# the given description pointing to the runtime shim type and protocol behavior.
# Covers:
# - Editor LSP providers (core/src/shim_input.rs): completion, hover, definition,
#   document colors, code actions, semantic tokens.
# - Editor highlighting and syntax context (core/src/shim_editor.rs).
# - Virtualized list and table delegates (core/src/shim_rows.rs).
# - Searchable select/combobox delegates (core/src/shim_select.rs).
# - Markdown plugin and highlight style resolver shims (core/src/editor_text.rs).
# - Plot painting shim (core/src/plot.rs) and settings field shims (core/src/values.rs).
[shims]
"CompletionProvider::completions" = "core/src/shim_input.rs GkCompletionProvider: a request answered with gk.answer"
"CompletionProvider::is_completion_trigger" = "core/src/shim_input.rs GkCompletionProvider: the trigger characters the app set"
"HoverProvider::hover" = "core/src/shim_input.rs GkHoverProvider: a request answered with gk.answer"
"InputHighlighter::language" = "core/src/shim_editor.rs GkHighlighter: the language the editor asked the factory for"
"InputHighlighter::update" = "core/src/shim_editor.rs GkHighlighter: keeps the editor's text; the answers about the old text are dropped"
"InputHighlighter::update_batch" = "core/src/shim_editor.rs GkHighlighter: upstream's default, each edit through update"
"InputHighlighter::styles" = "core/src/shim_editor.rs GkHighlighter: the app's named runs for (language, text, range), asked between frames (gk.Highlight_Query), through the editor's resolver; unstyled until answered"
"InputHighlighter::fold_ranges" = "core/src/shim_editor.rs GkHighlighter: the app's fold ranges for (language, text), asked between frames; none until answered"
"InputHighlighter::fold_ranges_for_edit" = "core/src/shim_editor.rs GkHighlighter: upstream's default, over fold_ranges"
"LanguageProvider::language_name" = "core/src/shim_editor.rs GkLanguages: the alias the app gave, else the name in lower case (upstream's default)"
"LanguageProvider::config" = "core/src/shim_editor.rs GkLanguages: upstream's default; an app's own configs go through set_language_config, which takes precedence"
"LanguageProvider::syntax_context_provider" = "core/src/shim_editor.rs GkLanguages: a GkSyntax when the app gave a syntax procedure"
"SyntaxContextProvider::context_at" = "core/src/shim_editor.rs GkSyntax: the app's answer for (language, text, offset), asked between frames (gk.Syntax_Query); Code until answered"
"ListDelegate::perform_search" = "core/src/shim_rows.rs GkListDelegate: a request (List_Event .Search) answered with gk.answer"
"ListDelegate::sections_count" = "core/src/shim_rows.rs GkListDelegate: the sections of the row source (gk.set_count with a section)"
"ListDelegate::items_count" = "core/src/shim_rows.rs GkListDelegate: the row source's count of the section"
"ListDelegate::render_item" = "core/src/shim_rows.rs GkListDelegate: the row's view, a gk.list_item described once, or a placeholder for one frame"
"ListDelegate::render_section_header" = "core/src/shim_rows.rs GkListDelegate: the section's HEADER row view (gk.Delegate_Data.headers)"
"ListDelegate::render_section_footer" = "core/src/shim_rows.rs GkListDelegate: the section's FOOTER row view (gk.Delegate_Data.footers)"
"ListDelegate::render_empty" = "core/src/shim_rows.rs GkListDelegate: the app's view (gk.Delegate_Data.empty) or upstream's"
"ListDelegate::render_initial" = "core/src/shim_rows.rs GkListDelegate: the app's view (gk.Delegate_Data.initial)"
"ListDelegate::loading" = "core/src/shim_rows.rs GkListDelegate: gk.Delegate_Data.loading"
"ListDelegate::render_loading" = "core/src/shim_rows.rs GkListDelegate: the app's view (gk.Delegate_Data.loading_view) or upstream's"
"ListDelegate::set_selected_index" = "core/src/shim_rows.rs GkListDelegate: List_Event .Select, queued"
"ListDelegate::set_right_clicked_index" = "core/src/shim_rows.rs GkListDelegate: List_Event .Right_Click, queued"
"ListDelegate::confirm" = "core/src/shim_rows.rs GkListDelegate: List_Event .Confirm, queued"
"ListDelegate::cancel" = "core/src/shim_rows.rs GkListDelegate: List_Event .Cancel, queued"
"ListDelegate::has_more" = "core/src/shim_rows.rs GkListDelegate: gk.Delegate_Data.has_more"
"ListDelegate::load_more_threshold" = "core/src/shim_rows.rs GkListDelegate: gk.Delegate_Data.threshold"
"ListDelegate::load_more" = "core/src/shim_rows.rs GkListDelegate: List_Event .Load_More, queued"
"TableDelegate::columns_count" = "core/src/shim_rows.rs GkTableDelegate: the columns the app gave (gk.table_state, gk.table_set_columns)"
"TableDelegate::rows_count" = "core/src/shim_rows.rs GkTableDelegate: the row source's count over the columns"
"TableDelegate::column" = "core/src/shim_rows.rs GkTableDelegate: the column the app gave, in the order the user moved them into"
"TableDelegate::perform_sort" = "core/src/shim_rows.rs GkTableDelegate: Table_Event .Sort, queued"
"TableDelegate::render_th" = "core/src/shim_rows.rs GkTableDelegate: the column's name, as upstream"
"TableDelegate::render_td" = "core/src/shim_rows.rs GkTableDelegate: the cell's view, described once, or nothing for one frame"
"TableDelegate::move_column" = "core/src/shim_rows.rs GkTableDelegate: the column order kept in the shim; Table_Event .Move_Column, queued"
"TableDelegate::render_empty" = "core/src/shim_rows.rs GkTableDelegate: the app's view (gk.Delegate_Data.empty) or upstream's"
"TableDelegate::loading" = "core/src/shim_rows.rs GkTableDelegate: gk.Delegate_Data.loading"
"TableDelegate::render_loading" = "core/src/shim_rows.rs GkTableDelegate: the app's view (gk.Delegate_Data.loading_view)"
"TableDelegate::has_more" = "core/src/shim_rows.rs GkTableDelegate: gk.Delegate_Data.has_more"
"TableDelegate::load_more_threshold" = "core/src/shim_rows.rs GkTableDelegate: gk.Delegate_Data.threshold"
"TableDelegate::load_more" = "core/src/shim_rows.rs GkTableDelegate: Table_Event .Load_More, queued"
"TableDelegate::visible_rows_changed" = "core/src/shim_rows.rs GkTableDelegate: binds the rows beside the visible ones; Table_Event .Visible_Rows when asked"
"TableDelegate::visible_columns_changed" = "core/src/shim_rows.rs GkTableDelegate: Table_Event .Visible_Columns when asked"
"SearchableListDelegate::sections_count" = "core/src/shim_select.rs GkSearchDelegate: the groups the app pushed (gk.search_items), the ones the filter keeps"
"SearchableListDelegate::items_count" = "core/src/shim_select.rs GkSearchDelegate: the group's items the filter keeps"
"SearchableListDelegate::item" = "core/src/shim_select.rs GkSearchDelegate: the visible item, a gk.Search_Item"
"SearchableListDelegate::position" = "core/src/shim_select.rs GkSearchDelegate: the visible item with that value"
"SearchableListDelegate::perform_search" = "core/src/shim_select.rs GkSearchDelegate: filters as SearchableVec does, or asks the app (Search_Request, answered with gk.answer)"
"SearchableListDelegate::render_item" = "core/src/shim_select.rs GkSearchDelegate: the item's row view when the source has a row procedure, else the kit's row"
"SearchableListDelegate::render_section_header" = "core/src/shim_select.rs GkSearchDelegate: the group's HEADER row view when the source draws headers, else the group's title in the kit's header"
"SearchableListDelegate::is_item_enabled" = "core/src/shim_select.rs GkSearchDelegate: not the item's disabled field"
"SearchableListDelegate::is_item_checked" = "core/src/shim_select.rs GkSearchDelegate: the item's value is in the selection"
"SearchableListItem::title" = "core/src/shim_select.rs GkItem: gk.Search_Item.title"
"SearchableListItem::display_title" = "core/src/shim_select.rs GkItem: gk.Search_Item.display, shown in the trigger"
"SearchableListItem::render" = "core/src/shim_select.rs GkItem: the title (a source with a row procedure draws its rows instead)"
"SearchableListItem::value" = "core/src/shim_select.rs GkItem: gk.Search_Item.value"
"SearchableListItem::matches" = "core/src/shim_select.rs GkItem: the title or the keywords contain the query, ignoring case"
"SearchableListItem::disabled" = "core/src/shim_select.rs GkItem: gk.Search_Item.disabled"
"TableDelegate::cell_text" = "core/src/shim_rows.rs GkTableDelegate: the cell's text the app pushed (gk.table_texts)"
"TableDelegate::cell_label" = "core/src/shim_rows.rs GkTableDelegate: the cell's text the app pushed (gk.table_texts), none when empty"
"TableDelegate::row_label" = "core/src/shim_rows.rs GkTableDelegate: the row's label the app pushed (gk.table_row_labels), else upstream's join of its cells' labels"
"TableDelegate::fit_column" = "core/src/shim_rows.rs GkTableDelegate: the column's fit width (gk.Table_Look.fit)"
"TableDelegate::group_headers" = "core/src/shim_rows.rs GkTableDelegate: gk.Table_Look.groups"
"TableDelegate::render_group_th" = "core/src/shim_rows.rs GkTableDelegate: the app's view for the group's label (gk.Table_Look.group_views), else upstream's centred label"
"TableDelegate::render_header" = "core/src/shim_rows.rs GkTableDelegate: upstream's header row refined by gk.Table_Look.header_style"
"TableDelegate::render_tr" = "core/src/shim_rows.rs GkTableDelegate: upstream's row refined by gk.Table_Look.row_style"
"TableDelegate::render_last_empty_col" = "core/src/shim_rows.rs GkTableDelegate: the app's view (gk.Table_Look.last_column), else upstream's filler"
"TableDelegate::context_menu" = "core/src/shim_rows.rs GkTableDelegate: the menu a cell of the row describes (gk.row_menu, PROTOCOLS.md 11.24)"
"SearchableListDelegate::on_will_change" = "core/src/shim_select.rs GkSearchDelegate: upstream's default, then the rules the app gave in advance (gk.search_will_change, PROTOCOLS.md 11.25)"
"CompletionProvider::inline_completion" = "core/src/shim_input.rs GkCompletionProvider: a request (Provider_Inline) answered with the text to insert"
"CompletionProvider::inline_completion_debounce" = "core/src/shim_input.rs GkCompletionProvider: the debounce the app set (gk.editor_providers)"
"DefinitionProvider::definitions" = "core/src/shim_input.rs GkDefinitionProvider: a request (Provider_Definitions) answered with []gk.Definition"
"DocumentColorProvider::document_colors" = "core/src/shim_input.rs GkDocumentColorProvider: a request (Provider_Colors) answered with []gk.Document_Color"
"CodeActionProvider::id" = "core/src/shim_input.rs GkCodeActionProvider: the id the app set (gk.editor_providers)"
"CodeActionProvider::code_actions" = "core/src/shim_input.rs GkCodeActionProvider: a request (Provider_Code_Actions) answered with []gk.Code_Action"
"CodeActionProvider::perform_code_action" = "core/src/shim_input.rs GkCodeActionProvider: a request (Provider_Perform) the app answers when it has edited"
"DocumentRangeSemanticTokensProvider::legend" = "core/src/shim_input.rs GkSemanticTokensProvider: the token types and modifiers the app set"
"DocumentRangeSemanticTokensProvider::semantic_tokens" = "core/src/shim_input.rs GkSemanticTokensProvider: a request (Provider_Tokens) answered with LSP's encoded []u32"
"MarkdownPlugin::is_block" = "core/src/editor_text.rs GkPlugin: the kit plugin's, or whether the data plugin's gk.Markdown_Match is a block kind"
"MarkdownPlugin::name" = "core/src/editor_text.rs GkPlugin: the kit plugin's, or gk.Markdown_Plugin.name"
"MarkdownPlugin::parse" = "core/src/editor_text.rs GkPlugin: the kit plugin's, or the nodes of the app's rule (a kind, a code block's language or a JSX element's name) made without calling the app: the plugin's name, the node's text and Markdown"
"MarkdownPlugin::render" = "core/src/editor_text.rs GkPlugin: the kit plugin's, or the node's row of the plugin's row source (gk.row_context: the node)"
"MarkdownPlugin::render_inline" = "core/src/editor_text.rs GkPlugin: the kit plugin's, or the node's row in an InlineElement with gk.Markdown_Plugin.baseline (gk.row_context: the node and the InlineRenderContext)"
"CompletionProvider::resolve_completions" = "core/src/shim_input.rs GkCompletionProvider: upstream's default (nothing to resolve): the app answers every gk.Completion_Item whole, with its detail"
"HighlightStyleResolver::style" = "core/src/editor_text.rs GkStyles: the app's answer for a highlight name (an ask, PROTOCOLS.md 9.26); unstyled until it is in"

"Plot::paint" = "core/src/plot.rs GkPlot: the parts the app described with gk.plot, painted in order"
"Plot::id" = "core/src/plot.rs GkPlot: the id given to gk.plot_with (PROTOCOLS.md 12.14)"
"Plot::interactive" = "core/src/plot.rs GkPlot: false when gk.plot_with was given not_interactive"
"Plot::appear_generation" = "core/src/plot.rs GkPlot: the appear generation given to gk.plot_with (0: none)"
"AnySettingField::field_type" = "core/src/values.rs AnyField: the field's own type (switch, input, dropdown, number, element)"
"AnySettingField::style" = "core/src/values.rs AnyField: the field's style (its Styled builders)"
"AnySettingField::is_resettable" = "core/src/values.rs AnyField: the field's dirty test, its value cell against its default"
"AnySettingField::reset" = "core/src/values.rs AnyField: the field's reset (its set_value handler with the default, or on_reset's)"
"SettingFieldElement::render_field" = "the fragment the app gives SettingField::element (gen/gk_values.py, a fragment closure)"

# Exact closure signatures routed to hand-written row-source constructors in core/src/.
# Keys match the normalized Rust Fn(...) signature built by gk_model.closure().
[rows]
"Fn(usize, &gpui_kit::base::TreeEntry, bool, &mut gpui_kit::Window, &mut gpui_kit::App) -> gpui_kit::component::list::ListItem" = "crate::shim_rows::tree_item"
"Fn(usize, &gpui_kit::base::TreeEntry, gpui_kit::component::menu::PopupMenu, &mut gpui_kit::Window, &mut gpui_kit::Context<gpui_kit::base::TreeState>) -> gpui_kit::component::menu::PopupMenu" = "crate::shim_rows::tree_menu"

# Non-element value types forced into the tape node table even though they do not
# implement IntoElement. Used for described values built through ViewBuild closures
# (Sheet, PopupMenu, ResizablePanelGroup), tooltip builders, and icons.
[node]
types = ["Sheet", "PopupMenu", "ResizablePanelGroup", "Tooltip", "Icon"]

# Concrete stand-in types substituted for opaque Into<T> target types that have no
# enumerable From<X> set in rustdoc (for example ButtonIcon -> Icon).
[into]
stand_in = { ButtonIcon = "gpui_kit::component::Icon" }

# Value-layer overrides consumed by gen/gk_values.py.
[values]
# Generic non-entity library objects instantiated at fixed concrete type arguments.
# Covers plot scales (ScaleBand/Point/Linear/Ordinal), motion curves and state
# (Sequence/Keyframes/Discrete/TransitionState), history/toast helpers, and Pie/Stack.
objects = [
    "ScaleBand<SharedString> as ScaleBand",
    "ScalePoint<SharedString> as ScalePoint",
    "ScaleLinear<f64> as ScaleLinear",
    "ScaleOrdinal<SharedString, Hsla> as ScaleOrdinal",
    "Sequence<f32> as Sequence",
    "SequenceStep<f32> as SequenceStep",
    "SequenceSample<f32> as SequenceSample",
    "Keyframes<f32> as Keyframes",
    "Discrete<f32> as Discrete",
    "TransitionState<f32> as TransitionState",
    "History<SharedString> as History",
    "UndoHistory<SharedString> as UndoHistory",
    "ToastManager<u64, u64> as ToastManager",
    "Pie<crate::data::Datum> as Pie",
    "Stack<crate::data::Datum> as Stack",
]
# Value-returning event closure signatures bound as synchronous request handlers.
event_closures = ["Fn(&mut gpui_kit::Window, &mut gpui_kit::App) -> gpui_kit::SharedString"]
# Upstream enums that carry builder methods and are bound as value nodes instead of flat enums.
enum_nodes = ["SettingItem", "PopupMenuItem"]

# List, table, and delegate overrides consumed by gen/gk_lists.py.
# - assoc: associated-type resolutions on runtime shim types (Shim::Assoc -> Concrete).
# - values: runtime structs serialized directly via hand-written Wire/Unwire impls.
# - unions: element traits expanded into tagged Go union types over implementing nodes.
# - delegates: type aliases or dyn-trait objects decoded by runtime factory shims.
[lists]
assoc = { "crate::shim_select::GkSearchDelegate::Item" = "crate::shim_select::GkItem", "crate::shim_select::GkItem::Value" = "SharedString" }
values = { "crate::shim_select::GkItem" = "Search_Item", "crate::values::Drag" = "Drag_Value" }
unions = { "ChildElement" = "Table_Child", "Sizable" = "Sizable_Element", "Selectable" = "Selectable_Element" }
delegates = { "InputHighlighterFactory" = "crate::shim_editor::highlighter_factory", "dyn LanguageProvider" = "crate::shim_editor::language_provider" }

# State call methods excluded from generated Go smoke tests (gen/gk_tests_go.py)
# because calling them with synthetic sample indices violates panel-tree invariants.
[tests]
calls = [
  "Resizable_State.insert_panel",
  "Resizable_State.remove_panel",
  "Resizable_State.reset_panel",
]

# Input record types that receive an ergonomic single-field integer shorthand constructor
# in Go (for example IndexPath keyed by its row index).
[shorthand]
"gpui_kit::base::IndexPath" = "row"

# Enum variants with private fields that are constructed through a public associated
# constructor function instead of a struct/tuple literal (Enum::Variant = "ctor_fn").
[editor]
variants = { "MaskPattern::Pattern" = "new" }

# Shorter constant prefixes for generated Go unit enums whose type name would be verbose.
[go.enum_prefix]
IconName = "Icon"
