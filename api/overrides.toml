"TableDelegate::group_headers" = "core/src/shim_rows.rs GkTableDelegate: gk.Table_Look.groups"
"TableDelegate::render_group_th" = "core/src/shim_rows.rs GkTableDelegate: the app's view for the group's label (gk.Table_Look.group_views), else upstream's centred label"
"TableDelegate::render_header" = "core/src/shim_rows.rs GkTableDelegate: upstream's header row refined by gk.Table_Look.header_style"
"TableDelegate::render_tr" = "core/src/shim_rows.rs GkTableDelegate: upstream's row refined by gk.Table_Look.row_style"
"TableDelegate::render_last_empty_col" = "core/src/shim_rows.rs GkTableDelegate: the app's view (gk.Table_Look.last_column), else upstream's filler"
"TableDelegate::context_menu" = "core/src/shim_rows.rs GkTableDelegate: the menu a cell of the row describes (gk.row_menu, PROTOCOLS.md 11.24)"
"SearchableListDelegate::on_will_change" = "core/src/shim_select.rs GkSearchDelegate: upstream's default, then the rules the app gave in advance (gk.search_will_change, PROTOCOLS.md 11.25)"
# The editor's other providers (docs/PROTOCOLS.md 9.11): requests over the input shims' channel.
"CompletionProvider::inline_completion" = "core/src/shim_input.rs GkCompletionProvider: a request (Provider_Inline) answered with the text to insert"
"CompletionProvider::inline_completion_debounce" = "core/src/shim_input.rs GkCompletionProvider: the debounce the app set (gk.editor_providers)"
"DefinitionProvider::definitions" = "core/src/shim_input.rs GkDefinitionProvider: a request (Provider_Definitions) answered with []gk.Definition"
"DocumentColorProvider::document_colors" = "core/src/shim_input.rs GkDocumentColorProvider: a request (Provider_Colors) answered with []gk.Document_Color"
"CodeActionProvider::id" = "core/src/shim_input.rs GkCodeActionProvider: the id the app set (gk.editor_providers)"
"CodeActionProvider::code_actions" = "core/src/shim_input.rs GkCodeActionProvider: a request (Provider_Code_Actions) answered with []gk.Code_Action"
"CodeActionProvider::perform_code_action" = "core/src/shim_input.rs GkCodeActionProvider: a request (Provider_Perform) the app answers when it has edited"
"DocumentRangeSemanticTokensProvider::legend" = "core/src/shim_input.rs GkSemanticTokensProvider: the token types and modifiers the app set"
"DocumentRangeSemanticTokensProvider::semantic_tokens" = "core/src/shim_input.rs GkSemanticTokensProvider: a request (Provider_Tokens) answered with LSP's encoded []u32"
# docs/PROTOCOLS.md 9.23: the library's one Markdown plugin, a kit plugin or a data plugin.
"MarkdownPlugin::is_block" = "core/src/editor_text.rs GkPlugin: the kit plugin's, or whether the data plugin's gk.Markdown_Match is a block kind"
"MarkdownPlugin::name" = "core/src/editor_text.rs GkPlugin: the kit plugin's, or gk.Markdown_Plugin.name"
"MarkdownPlugin::parse" = "core/src/editor_text.rs GkPlugin: the kit plugin's, or the nodes of the app's rule (a kind, a code block's language or a JSX element's name) made without calling the app: the plugin's name, the node's text and Markdown"
"MarkdownPlugin::render" = "core/src/editor_text.rs GkPlugin: the kit plugin's, or the node's row of the plugin's row source (gk.row_context: the node)"
"MarkdownPlugin::render_inline" = "core/src/editor_text.rs GkPlugin: the kit plugin's, or the node's row in an InlineElement with gk.Markdown_Plugin.baseline (gk.row_context: the node and the InlineRenderContext)"
"CompletionProvider::resolve_completions" = "core/src/shim_input.rs GkCompletionProvider: upstream's default (nothing to resolve): the app answers every gk.Completion_Item whole, with its detail"
"HighlightStyleResolver::style" = "core/src/editor_text.rs GkStyles: the app's answer for a highlight name (an ask, PROTOCOLS.md 9.26); unstyled until it is in"
# (end of the lists and editor families' shims)

# A described plot (docs/PROTOCOLS.md section 12): the library's one Plot impl paints the parts
# the app gave gk.plot. The trait's other methods keep upstream's defaults (no id: no hover).
"Plot::paint" = "core/src/plot.rs GkPlot: the parts the app described with gk.plot, painted in order"
"Plot::id" = "core/src/plot.rs GkPlot: the id given to gk.plot_with (PROTOCOLS.md 12.14)"
"Plot::interactive" = "core/src/plot.rs GkPlot: false when gk.plot_with was given not_interactive"
"Plot::appear_generation" = "core/src/plot.rs GkPlot: the appear generation given to gk.plot_with (0: none)"
# The settings fields (docs/PROTOCOLS.md 13.19, the values family): upstream calls these on the
# library's AnyField, which hands each to the field the app built.
"AnySettingField::field_type" = "core/src/values.rs AnyField: the field's own type (switch, input, dropdown, number, element)"
"AnySettingField::style" = "core/src/values.rs AnyField: the field's style (its Styled builders)"
"AnySettingField::is_resettable" = "core/src/values.rs AnyField: the field's dirty test, its value cell against its default"
"AnySettingField::reset" = "core/src/values.rs AnyField: the field's reset (its set_value handler with the default, or on_reset's)"
"SettingFieldElement::render_field" = "the fragment the app gives SettingField::element (gen/gk_values.py, a fragment closure)"

# Closures a delegate shim serves over a row source (docs/PROTOCOLS.md section 9.5), by their
# signature in public paths: the shim function that makes one from the source. The app passes a
# gk.Row_Source where upstream takes the closure.
[rows]
"Fn(usize, &gpui_kit::base::TreeEntry, bool, &mut gpui_kit::Window, &mut gpui_kit::App) -> gpui_kit::component::list::ListItem" = "crate::shim_rows::tree_item"
"Fn(usize, &gpui_kit::base::TreeEntry, gpui_kit::component::menu::PopupMenu, &mut gpui_kit::Window, &mut gpui_kit::Context<gpui_kit::base::TreeState>) -> gpui_kit::component::menu::PopupMenu" = "crate::shim_rows::tree_menu"  # the menu row ix's view describes (PROTOCOLS.md 11.24)

# Odin types the hand-written bridges of the package declare (odin/gk/kit_*.odin); the
# generator uses the name and its field h and does not declare the type.
[runtime]
odin_types = []

# Types that are value nodes although their impls make them entity state (docs/PROTOCOLS.md
# 11.6): the kit's Sheet, which open_sheet's closure builds, and PopupMenu, described as the
# value a dropdown, context or submenu's closure builds.
[node]
types = ["Sheet", "PopupMenu", "ResizablePanelGroup", "Tooltip", "Icon"]  # Icon: an element (Icon::new(name), RenderOnce) although it is also a Render; ResizablePanelGroup: an element that implements EventEmitter (the values family, PROTOCOLS.md 13.20); Tooltip: the kit's tooltip view as a value a view closure builds (PROTOCOLS.md 11.17)

# An `impl Into<X>` whose X the extract cannot name (a type in a private module of the kit) is
# bound as `impl Into<Y>` for the public type Y named here, which converts into X upstream:
# Button::icon takes `impl Into<ButtonIcon>`, and ButtonIcon is made from
# anything that is Into<Icon>, so a button takes the icon a tab or a menu item takes.
[into]
stand_in = { ButtonIcon = "gpui_kit::component::Icon" }

# The values family (docs/PROTOCOLS.md sections 13.8 to 13.12; gen/gk_values.py).
[values]
# Generic library objects instantiated for an argument list: "Generic<Args> as Name". Each is a
# library object behind handles (section 13): calculators an app calls between frames. Plot
# scales over text bands and numbers, motion values over f32.
objects = [
    "ScaleBand<SharedString> as ScaleBand",
    "ScalePoint<SharedString> as ScalePoint",
    "ScaleLinear<f64> as ScaleLinear",
    "ScaleOrdinal<SharedString, Hsla> as ScaleOrdinal",
    "Sequence<f32> as Sequence",
    "SequenceStep<f32> as SequenceStep",
    "SequenceSample<f32> as SequenceSample",
    "Keyframes<f32> as Keyframes",
    "Discrete<f32> as Discrete",
    # The platform and motion families (PROTOCOLS.md 13.30): a transition's state the app keeps with its
    # data (a row's highlight), sampled while drawing by gk.motion's to_state.
    "TransitionState<f32> as TransitionState",
    # The editor family's generic histories, for entries the app keeps as strings (the lists and
    # editor family, docs/PROTOCOLS.md 9.11).
    "History<SharedString> as History",
    "UndoHistory<SharedString> as UndoHistory",
    # The overlays and charts families, docs/PROTOCOLS.md 11.10, 12.15: the toast stack's
    # bookkeeping over the app's u64 ids and u64 values, and the pie and stack layouts over rows
    # of the app's data.
    "ToastManager<u64, u64> as ToastManager",
    "Pie<crate::data::Datum> as Pie",
    "Stack<crate::data::Datum> as Stack",
]
# Closures upstream calls from an event, never while it draws, that return text: a handler whose
# procedure returns a string (PROTOCOLS.md 13.12). By signature in public paths.
event_closures = ["Fn(&mut gpui_kit::Window, &mut gpui_kit::App) -> gpui_kit::SharedString"]
# Enums that are value nodes, built by their constructors and builders like a builder struct
# (PROTOCOLS.md 13.19): a settings item (`SettingItem::new(title, field)`, `render`).
enum_nodes = ["SettingItem", "PopupMenuItem"]  # PopupMenuItem: the views family (a menu item PopupMenu::item takes)
# The lists and editor families (docs/PROTOCOLS.md sections 9.9 to 9.12; gen/gk_lists.py).
[lists]
# Associated types of the library's delegate shims: "Shim::Name" = a library type (crate::...),
# a primitive, or an upstream or gpui type by name. `D::Item` of a state instantiated for the shim
# is the shim's item type.
assoc = { "crate::shim_select::GkSearchDelegate::Item" = "crate::shim_select::GkItem", "crate::shim_select::GkItem::Value" = "SharedString" }
# Library types that travel both ways as plain values: the Odin struct the family's kit file
# declares (written and read by reflection; Rust: the type's Wire and Unwire impls).
values = { "crate::shim_select::GkItem" = "Search_Item", "crate::values::Drag" = "Drag_Value" }
# Traits whose implementors are node types, taken as one of them (`Table::child(impl
# ChildElement)`): the Odin union the family's kit file declares.
unions = { "ChildElement" = "Table_Child", "Sizable" = "Sizable_Element", "Selectable" = "Selectable_Element" }
# Delegates the library implements over procedures of the app (docs/PROTOCOLS.md 9.18): a type
# alias, or "dyn Trait" for Rc, Arc or Box of it, = the library function that makes the upstream
# value from the handle the app passes (a gk.Row_Source: gk.highlighter(..).src, gk.language_provider).
delegates = { "InputHighlighterFactory" = "crate::shim_editor::highlighter_factory", "dyn LanguageProvider" = "crate::shim_editor::language_provider" }
# (end of the lists and editor families' table)

# The generated states test (gen/gk_tests.py, core/tests/gen): calls it must not make with its fixed
# sample arguments, each with the reason. Shared: append a line.
[tests]
calls = [
  # upstream inserts at the sample index (3) into an empty state and panics past the end (Vec::insert)
  "Resizable_State.insert_panel",
  # the same for an index past the end: Vec::remove and an index into the sizes panic upstream
  "Resizable_State.remove_panel",
  "Resizable_State.reset_panel",
]

# Records a parameter may also take as one of their integer fields alone, the other fields zero
# (docs/PROTOCOLS.md 11.36): "record" = "field". Every emitter offers it
# wherever a parameter is the record, an option of it or a list of it; the full record is still
# taken and the wire is the record's. IndexPath as a row: `list->set_selected_index(cx, 4)`,
# `gk.select_state(cx, src, 0)`.
[shorthand]
"gpui_kit::base::IndexPath" = "row"

# The editor family (docs/PROTOCOLS.md 9.29; gen/gk_editor.py): a variant the binding cannot build
# field by field (its other fields are private types) made by the enum's constructor, whose
# parameters are named as some of its fields: "Enum::Variant" = "constructor".
[editor]
variants = { "MaskPattern::Pattern" = "new" }

# The Go front end (docs/GO.md section 2): an enum's values are its Go type name followed by the
# variant's (gk.ButtonVariantPrimary); these enums use a shorter prefix.
[go.enum_prefix]
IconName = "Icon"
