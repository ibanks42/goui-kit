"PlotMotion::pointer" = "builder-getter: returns the Spring the app gave with_pointer; a Spring has no public reads (also the read of a PlotMotion read back)"
"PlotMotion::enter" = "builder-getter: returns the Transition the app gave with_enter; a Transition has no public reads (also the read of a PlotMotion read back)"
"PlotMotion::exit" = "builder-getter: returns the Transition the app gave with_exit; a Transition has no public reads (also the read of a PlotMotion read back)"
"PlotMotion::appear" = "builder-getter: returns the Transition the app gave with_appear; a Transition has no public reads (also the read of a PlotMotion read back)"
"TextSelectionScopeId::new" = "rust-only-extension: scopes a custom Rust element's registration (TextSelectionRegistration::with_scope, skipped the same way)"
"gpui_kit::base::TextSelectionScopeId::Default::default" = "rust-only-extension: scopes a custom Rust element's registration (TextSelectionRegistration::with_scope, skipped the same way)"
