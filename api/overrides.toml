"TextSelectionHandle::refresh_window_on_change" = "rust-only-extension: a custom Rust element's text runs (Hitbox, TextLayout from its prepaint) joining the kit's selection; the kit's text elements select without it"
"TextSelectionHandle::focus_with" = "rust-only-extension: a custom Rust element's text runs (Hitbox, TextLayout from its prepaint) joining the kit's selection; the kit's text elements select without it"
"TextSelectionHandle::clear_with" = "rust-only-extension: a custom Rust element's text runs (Hitbox, TextLayout from its prepaint) joining the kit's selection; the kit's text elements select without it"
"TextSelectionHandle::copy_with" = "rust-only-extension: a custom Rust element's text runs (Hitbox, TextLayout from its prepaint) joining the kit's selection; the kit's text elements select without it"
"TextSelectionHandle::prepaint_touch_handles" = "rust-only-extension: a custom Rust element's text runs (Hitbox, TextLayout from its prepaint) joining the kit's selection; the kit's text elements select without it"
"TextSelectionHandle::resolve_content_key_with" = "rust-only-extension: a custom Rust element's text runs (Hitbox, TextLayout from its prepaint) joining the kit's selection; the kit's text elements select without it"
"TextSelectionEndpoint::entity_id" = "rust-only-extension: a custom Rust element's text runs (Hitbox, TextLayout from its prepaint) joining the kit's selection; the kit's text elements select without it"
"TextSelectionEndpoint::content_key" = "rust-only-extension: a custom Rust element's text runs (Hitbox, TextLayout from its prepaint) joining the kit's selection; the kit's text elements select without it"
