"InputContextMenuCapabilities::code_actions" = "value-helper: upstream makes an input's context-menu capabilities itself (InputState::context_menu_capabilities, read back; on_context_menu's handler gets them); no public function takes one"
"gpui_kit::base::input::NativeMenu::new" = "value-helper: the editor's context-menu model, which upstream makes and hands to on_context_menu's handler (its items read back); no public function takes one"
"gpui_kit::base::input::NativeMenu::Default::default" = "value-helper: the editor's context-menu model, which upstream makes and hands to on_context_menu's handler (its items read back); no public function takes one"
"gpui_kit::base::input::NativeMenu::menu" = "value-helper: the editor's context-menu model, which upstream makes and hands to on_context_menu's handler (its items read back); no public function takes one"
