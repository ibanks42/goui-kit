# Trait methods a hand-written shim of the delegate protocol implements (docs/PROTOCOLS.md
# section 9): "Trait::method" = "where". Counted as bridged; the trait's other methods keep
# upstream's defaults and their [traits.role] reason. Each family owns its own lines.
[shims]
"CompletionProvider::completions" = "core/src/shim_input.rs GkCompletionProvider: a request answered with gk.answer"
"CompletionProvider::is_completion_trigger" = "core/src/shim_input.rs GkCompletionProvider: the trigger characters the app set"
"HoverProvider::hover" = "core/src/shim_input.rs GkHoverProvider: a request answered with gk.answer"
# docs/PROTOCOLS.md 9.18: delegates answered between frames, over asks (9.14).
"InputHighlighter::language" = "core/src/shim_editor.rs GkHighlighter: the language the editor asked the factory for"
"InputHighlighter::update" = "core/src/shim_editor.rs GkHighlighter: keeps the editor's text; the answers about the old text are dropped"
"InputHighlighter::update_batch" = "core/src/shim_editor.rs GkHighlighter: upstream's default, each edit through update"
"InputHighlighter::styles" = "core/src/shim_editor.rs GkHighlighter: the app's named runs for (language, text, range), asked between frames (gk.Highlight_Query), through the editor's resolver; unstyled until answered"
"InputHighlighter::fold_ranges" = "core/src/shim_editor.rs GkHighlighter: the app's fold ranges for (language, text), asked between frames; none until answered"
"InputHighlighter::fold_ranges_for_edit" = "core/src/shim_editor.rs GkHighlighter: upstream's default, over fold_ranges"
"LanguageProvider::language_name" = "core/src/shim_editor.rs GkLanguages: the alias the app gave, else the name in lower case (upstream's default)"
"LanguageProvider::config" = "core/src/shim_editor.rs GkLanguages: upstream's default; an app's own configs go through set_language_config, which takes precedence"
"LanguageProvider::syntax_context_provider" = "core/src/shim_editor.rs GkLanguages: a GkSyntax when the app gave a syntax procedure"
"SyntaxContextProvider::context_at" = "core/src/shim_editor.rs GkSyntax: the app's answer for (language, text, offset), asked between frames (gk.Syntax_Query); Code until answered"
# The rows family's delegates (docs/PROTOCOLS.md section 9.5). The table's other methods
# (fit_column, render_header, group_headers, render_group_th, cell_label, row_label,
# render_tr, context_menu, render_last_empty_col, cell_text) keep upstream's defaults.
"ListDelegate::perform_search" = "core/src/shim_rows.rs GkListDelegate: a request (List_Event .Search) answered with gk.answer"
"ListDelegate::sections_count" = "core/src/shim_rows.rs GkListDelegate: the sections of the row source (gk.set_count with a section)"
"ListDelegate::items_count" = "core/src/shim_rows.rs GkListDelegate: the row source's count of the section"
"ListDelegate::render_item" = "core/src/shim_rows.rs GkListDelegate: the row's view, a gk.list_item described once, or a placeholder for one frame"
"ListDelegate::render_section_header" = "core/src/shim_rows.rs GkListDelegate: the section's HEADER row view (gk.Delegate_Data.headers)"
"ListDelegate::render_section_footer" = "core/src/shim_rows.rs GkListDelegate: the section's FOOTER row view (gk.Delegate_Data.footers)"
"ListDelegate::render_empty" = "core/src/shim_rows.rs GkListDelegate: the app's view (gk.Delegate_Data.empty) or upstream's"
"ListDelegate::render_initial" = "core/src/shim_rows.rs GkListDelegate: the app's view (gk.Delegate_Data.initial)"
"ListDelegate::loading" = "core/src/shim_rows.rs GkListDelegate: gk.Delegate_Data.loading"
"ListDelegate::render_loading" = "core/src/shim_rows.rs GkListDelegate: the app's view (gk.Delegate_Data.loading_view) or upstream's"
"ListDelegate::set_selected_index" = "core/src/shim_rows.rs GkListDelegate: List_Event .Select, queued"
"ListDelegate::set_right_clicked_index" = "core/src/shim_rows.rs GkListDelegate: List_Event .Right_Click, queued"
"ListDelegate::confirm" = "core/src/shim_rows.rs GkListDelegate: List_Event .Confirm, queued"
"ListDelegate::cancel" = "core/src/shim_rows.rs GkListDelegate: List_Event .Cancel, queued"
"ListDelegate::has_more" = "core/src/shim_rows.rs GkListDelegate: gk.Delegate_Data.has_more"
"ListDelegate::load_more_threshold" = "core/src/shim_rows.rs GkListDelegate: gk.Delegate_Data.threshold"
"ListDelegate::load_more" = "core/src/shim_rows.rs GkListDelegate: List_Event .Load_More, queued"
"TableDelegate::columns_count" = "core/src/shim_rows.rs GkTableDelegate: the columns the app gave (gk.table_state, gk.table_set_columns)"
"TableDelegate::rows_count" = "core/src/shim_rows.rs GkTableDelegate: the row source's count over the columns"
"TableDelegate::column" = "core/src/shim_rows.rs GkTableDelegate: the column the app gave, in the order the user moved them into"
"TableDelegate::perform_sort" = "core/src/shim_rows.rs GkTableDelegate: Table_Event .Sort, queued"
"TableDelegate::render_th" = "core/src/shim_rows.rs GkTableDelegate: the column's name, as upstream"
"TableDelegate::render_td" = "core/src/shim_rows.rs GkTableDelegate: the cell's view, described once, or nothing for one frame"
"TableDelegate::move_column" = "core/src/shim_rows.rs GkTableDelegate: the column order kept in the shim; Table_Event .Move_Column, queued"
"TableDelegate::render_empty" = "core/src/shim_rows.rs GkTableDelegate: the app's view (gk.Delegate_Data.empty) or upstream's"
"TableDelegate::loading" = "core/src/shim_rows.rs GkTableDelegate: gk.Delegate_Data.loading"
"TableDelegate::render_loading" = "core/src/shim_rows.rs GkTableDelegate: the app's view (gk.Delegate_Data.loading_view)"
"TableDelegate::has_more" = "core/src/shim_rows.rs GkTableDelegate: gk.Delegate_Data.has_more"
"TableDelegate::load_more_threshold" = "core/src/shim_rows.rs GkTableDelegate: gk.Delegate_Data.threshold"
"TableDelegate::load_more" = "core/src/shim_rows.rs GkTableDelegate: Table_Event .Load_More, queued"
"TableDelegate::visible_rows_changed" = "core/src/shim_rows.rs GkTableDelegate: binds the rows beside the visible ones; Table_Event .Visible_Rows when asked"
"TableDelegate::visible_columns_changed" = "core/src/shim_rows.rs GkTableDelegate: Table_Event .Visible_Columns when asked"
