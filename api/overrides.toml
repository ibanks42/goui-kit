# overrides.toml: the only hand-edited input of the generator (DESIGN.md section 13).
# Every key must match something in the extracted API, or generation fails.

# The parts of gpui the kit's elements are made of. Everything else in gpui is reached through
# the runtime's own protocols (contexts, windows, handles) and is not generated from here.
[gpui]
types = ["Div", "Img", "Svg", "StyleRefinement"]
traits = ["Styled", "InteractiveElement", "StatefulInteractiveElement", "ParentElement"]
functions = ["div", "img", "svg"]

# Generic wrappers a type-changing method returns, instantiated per argument (DESIGN.md 6).
[instantiate]
types = [
    "Stateful<Div>",
    # Elements generic over a delegate, instantiated for the rows family's shims (PROTOCOLS.md 9.5).
    "List<crate::shim_rows::GkListDelegate> as List",
    "DataTable<crate::shim_rows::GkTableDelegate> as DataTable",
    # Charts over the data protocol (docs/PROTOCOLS.md section 12): T a row of the app's data
    # table, labels SharedString, values f64.
    "LineChart<crate::data::Datum, SharedString, f64> as LineChart",
    "AreaChart<crate::data::Datum, SharedString, f64> as AreaChart",
    "BarChart<crate::data::Datum, SharedString, f64> as BarChart",
    "CandlestickChart<crate::data::Datum, SharedString, f64> as CandlestickChart",
    "PieChart<crate::data::Datum> as PieChart",
    "RadarChart<crate::data::Datum, f64> as RadarChart",
    "SankeyChart<crate::data::Datum> as SankeyChart",
    # The plot shapes, parts of a described plot (gk.plot): x and y name columns of pixels.
    "Line<crate::data::Datum> as LineShape",
    "Area<crate::data::Datum> as AreaShape",
    "Bar<crate::data::Datum> as BarShape",
    "RadialLine<crate::data::Datum> as RadialLineShape",
    # Elements generic over their children's type, instantiated for the kit's own child type.
    "Sidebar<SidebarMenu> as Sidebar",
    # Elements generic over a searchable-list delegate, instantiated for the library's shim of it
    # (docs/PROTOCOLS.md section 9.9).
    "Select<crate::shim_select::GkSearchDelegate> as Select",
    "Combobox<crate::shim_select::GkSearchDelegate> as Combobox",
    # The scroll mask over gpui's ScrollHandle, the scroll handle the binding holds (PROTOCOLS.md
    # 13.14).
    "ScrollableMask<ScrollHandle> as ScrollableMask",
    # A settings field over each type a field holds (docs/PROTOCOLS.md 13.19): a switch or checkbox
    # (bool), an input or dropdown (SharedString), a number input (f64).
    "SettingField<bool> as SettingFieldBool",
    "SettingField<SharedString> as SettingFieldText",
    "SettingField<f64> as SettingFieldNumber",
    # The kit's resize handle over the library's drag value, its preview the app's view (13.20).
    "ResizeHandle<crate::values::Drag, crate::rt::GkView> as ResizeHandle",
    # The views family: a sidebar group of the kit's menus, and a sidebar of such groups.
    "SidebarGroup<SidebarMenu> as SidebarGroup",
    "Sidebar<SidebarGroup<SidebarMenu>> as GroupedSidebar",
]
# Library types a type parameter can be given that are rows of a data table the app passes
# (docs/PROTOCOLS.md section 12): `data` arguments, `field` and `format` closures.
data = ["crate::data::Datum"]
# Generic entity states, one state type per line: "Generic<Arg> as Name" (docs/PROTOCOLS.md
# section 9.6). Arg is an upstream type or a shim type of the library (crate::...). Every
# method of an impl that holds for Arg is bound on the state type Name. Each family owns its
# own lines: the input family the three below, the rows family its ListState and TableState.
states = [
    "InputBaseState<InputMode> as InputState",
    "InputBaseState<EditorMode> as EditorState",
    "InputBaseState<TextareaMode> as TextareaState",
    "ListState<crate::shim_rows::GkListDelegate> as ListState",
    "TableState<crate::shim_rows::GkTableDelegate> as TableState",
    "SelectState<crate::shim_select::GkSearchDelegate> as SelectState",
    "ComboboxState<crate::shim_select::GkSearchDelegate> as ComboboxState",
]

[traits]
# Traits whose methods only write the element's StyleRefinement: decoded once, by one
# non-generic function, instead of once per styled type.
via_style = ["Styled", "StyledExt", "StyleSized", "ThemeStyled"]

# Traits whose methods are not builders of a tape: the reason every method gets.
[traits.role]
TableDelegate = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
ListDelegate = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
SearchableListDelegate = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
SearchableListItem = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
Panel = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
PanelView = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
PanelSource = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
PanelBuilder = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
DockAreaRenderer = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
TabGroupRenderer = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
InputModeKind = "skip:rust-only-extension"
InputExtras = "skip:rust-only-extension"
InputHighlighter = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
MarkdownPlugin = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
CompletionProvider = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
CodeActionProvider = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
LanguageProvider = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
DocumentRangeSemanticTokensProvider = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
DefinitionProvider = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
DocumentColorProvider = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
HoverProvider = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
SyntaxContextProvider = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
HighlightStyleResolver = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
RootPlugin = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
Plot = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
AnySettingField = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
SettingFieldElement = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
SpeechRecognizer = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
RecognitionSession = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
AudioInput = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
ScrollbarHandle = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
DialogFooterButton = "todo:protocol: delegates (a trait the app implements: one bridge per trait)"
RopeExt = "skip:third-party-type"
Colorize = "skip:value-helper"
AxisExt = "skip:value-helper"
Interpolate = "skip:value-helper"
Lerp = "skip:value-helper"
LengthExt = "skip:value-helper"
OngoingScrollExt = "skip:value-helper"
WindowExt = "todo:protocol: calls (ambient context: methods on Window and App)"
ActiveTheme = "todo:protocol: calls (ambient context: methods on Window and App)"

# Types that are entity state although nothing in their impls says so.
[state]
types = []
# Types upstream makes a gpui Render (so the generator would hold them as entities) that are
# values the app passes by value and gets back by value: held as library objects instead
# (PROTOCOLS.md 13.31). DragPanel: the dock's drag value (Clone; base renders it as Empty, the
# component crate's skin draws the preview), taken by TabGroupContext::drop_panel and handed
# out by drag_panel.
objects = ["DragPanel"]
# Reads that also get a try_ form in Odin (ok is false while the state is on lease: a handler
# the component calls from inside its own update). Every state type that has the read gets it.
try_reads = ["value"]

# "Type::method" or a full item id = "reason: note". The reason is one of the fixed list.
[skip]
"gpui_kit::component::DivInspector::new" = "feature-off: exists only in a debug build of the kit (cfg(debug_assertions)); the library is a release build"
"gpui_kit::component::ToggleInspector::Default::default" = "feature-off: exists only in a debug build of the kit (cfg(debug_assertions)); the library is a release build"
"gpui_kit::Styled::debug" = "feature-off: exists only in a debug build of gpui (cfg(debug_assertions)); the library is a release build"
"gpui_kit::Styled::debug_below" = "feature-off: exists only in a debug build of gpui (cfg(debug_assertions)); the library is a release build"
# Rust extension points of the searchable lists (docs/PROTOCOLS.md section 9.9): SearchableListState is
# the shared core a new searchable component is written on in Rust (its constructor needs the
# parent entity's Context<P>; SelectState and ComboboxState embed it), SearchableVec a delegate a
# Rust app gives Select. The binding's delegate is GkSearchDelegate, which filters the same way.
"SearchableListState::new" = "rust-only-extension: the core a new searchable component is built on in Rust, in the parent entity's Context; SelectState and ComboboxState are bound"
"SearchableListState::selection" = "rust-only-extension: SearchableListState is reachable only by a Rust component that embeds it; SelectState and ComboboxState are bound"
"SearchableListState::selected_values" = "rust-only-extension: SearchableListState is reachable only by a Rust component that embeds it; SelectState and ComboboxState are bound"
"SearchableListState::is_open" = "rust-only-extension: SearchableListState is reachable only by a Rust component that embeds it; SelectState and ComboboxState are bound"
"SearchableListState::focus_handle" = "rust-only-extension: SearchableListState is reachable only by a Rust component that embeds it; SelectState and ComboboxState are bound"
"SearchableListState::add_selected_index" = "rust-only-extension: SearchableListState is reachable only by a Rust component that embeds it; SelectState and ComboboxState are bound"
"SearchableListState::remove_selected_index" = "rust-only-extension: SearchableListState is reachable only by a Rust component that embeds it; SelectState and ComboboxState are bound"
"SearchableListState::set_selected_indices" = "rust-only-extension: SearchableListState is reachable only by a Rust component that embeds it; SelectState and ComboboxState are bound"
"SearchableVec::new" = "rust-only-extension: a delegate implementation for Rust apps; the binding's delegate (core/src/shim_select.rs GkSearchDelegate) filters the app's items the same way"
"SearchableVec::push" = "rust-only-extension: a delegate implementation for Rust apps; the binding's delegate (core/src/shim_select.rs GkSearchDelegate) filters the app's items the same way"
