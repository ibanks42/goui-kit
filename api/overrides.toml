"SearchableListItem::display_title" = "core/src/shim_select.rs GkItem: gk.Search_Item.display, shown in the trigger"
"SearchableListItem::render" = "core/src/shim_select.rs GkItem: the title (a source with a row procedure draws its rows instead)"
