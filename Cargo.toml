# Workspace containing the C ABI runtime library, its instrumentation/headless
# runner crate, and the pure-Rust reference apps used by pixel and behavior gates.
[workspace]
resolver = "3"
members = ["core/meter", "core", "ref"]

[workspace.package]
version = "0.0.2"
edition = "2024"
publish = false

[workspace.dependencies]
# Pinned to match the API snapshot and generated opcodes in core/src/gen/.
gpui-kit = { version = "=0.11.0", features = ["syntect"] }
gk-meter = { path = "core/meter", default-features = false }

[profile.release]
strip = "symbols"
# Keep unwinding enabled so FFI entry points can catch panics across the C ABI boundary.
panic = "unwind"
