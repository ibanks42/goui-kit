# C ABI runtime library (libgpuikit) that decodes tape commands and drives gpui-kit.
[package]
name = "gk-capi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "gpuikit"
crate-type = ["cdylib", "staticlib"]

[dependencies]
gpui-kit.workspace = true
gpui-fps = { version = "=0.11.0", features = ["gpui-fast"], optional = true }
gk-meter.workspace = true
futures = "0.3"

# Versions pinned to match the exact types re-exported or expected by gpui-kit.
anyhow = "1"
lsp-types = "=0.97.0"
ropey = "=2.0.0-beta.1"
jiff = { version = "=1.0.2", default-features = false }
serde_json = "=1.0.154"
accesskit = { version = "=0.24.1", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[features]
default = ["gpui-fast"]

# Enables the gpui-fast backend across gpui-kit and gk-meter.
gpui-fast = ["gpui-kit/gpui-fast", "gk-meter/gpui-fast"]

# Diagnostic build: enables headless scripted execution, screenshot capture, and layout counters.
diag = ["gpui-fast", "gpui-kit/test-support", "dep:gpui-fps", "gk-meter/diag"]

# Reserved feature flag for full-family builds.
all = []
