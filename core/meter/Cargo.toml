# Shared runtime instrumentation, input helpers, and headless script runner
# used by both libgouikit and the pure-Rust reference apps.
[package]
name = "gk-meter"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
libc = "0.2"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
default = ["gpui-fast"]
gpui-fast = ["gpui-kit/gpui-fast"]

# Enables headless offscreen rendering, PNG capture, and GPUI layout stats.
diag = ["gpui-fast", "gpui-kit/test-support", "dep:image"]
