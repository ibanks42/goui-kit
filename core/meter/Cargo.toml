[package]
name = "gk-meter"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
libc = "0.2"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
# Retention counters (Window::layout_stats) and the offscreen driver need gpui's test-support.
default = ["gpui-fast"]
gpui-fast = ["gpui-kit/gpui-fast"]
# Retention counters exist only in gpui-fast.
diag = ["gpui-fast", "gpui-kit/test-support", "dep:image"]
